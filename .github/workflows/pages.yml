name: Publier Cyber Reflexes sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Verifier le JavaScript et le contenu
        run: node scripts/check.cjs
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Preparer les fichiers publics
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
